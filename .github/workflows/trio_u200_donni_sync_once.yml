name: Temporary Donni2020 Trio U200 integration
on:
  push:
    branches:
      - update/trio-u200-donni-20261120

permissions:
  contents: write

jobs:
  sync:
    if: startsWith(github.event.head_commit.message, '[donni-sync-start]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout update branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Apply the verified upstream delta while preserving local checker
        shell: bash
        env:
          OLD_SOURCE: a820dd99cbc7827171f03ce8f6f7d4978b0f22dd
          NEW_SOURCE: df055327a9f51d74cf8c32b93dee6388ac0e41de
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          test "$(cat .github/u200-last-synced.txt | tr -d '[:space:]')" = "$OLD_SOURCE" || {
            echo "::error::Last synced SHA has changed. Stopping."
            exit 1
          }
          git remote add donni https://github.com/Donni2020/Trio-U200.git
          git fetch --no-tags --depth=1 donni "$OLD_SOURCE" "$NEW_SOURCE"
          git cat-file -e "$OLD_SOURCE^{commit}"
          git cat-file -e "$NEW_SOURCE^{commit}"
          echo "Applying Donni2020 changes between source snapshots..."
          # The user already has this identical entitlements file; exclude it from
          # the upstream add operation to prevent an add/add conflict.
          git diff --binary --full-index "$OLD_SOURCE" "$NEW_SOURCE" -- \
            . ':(exclude)Trio Watch App/TrioWatchApp.entitlements' \
            | git apply --3way --index -
          # Verify every non-custom source file now matches the requested source.
          while IFS= read -r -d '' file; do
            case "$file" in
              "Trio.xcodeproj/project.pbxproj"|"Trio Watch App/TrioWatchApp.entitlements") continue ;;
            esac
            if [[ ! -f "$file" || "$(git hash-object "$file")" != "$(git rev-parse "$NEW_SOURCE:$file")" ]]; then
              echo "::error::Upstream file mismatch: $file"
              exit 1
            fi
          done < <(git diff --name-only -z "$OLD_SOURCE" "$NEW_SOURCE")
          # Do not replace the existing updater, signing or build choices.
          for protected in \
            ".github/workflows/check_u200_updates.yml" \
            ".github/workflows/build_trio.yml" \
            "Config.xcconfig" \
            "Trio/Resources/Info.plist" \
            "Trio/Resources/InfoPlist.xcstrings" \
            "Trio/Resources/Trio.entitlements" \
            "LiveActivity/Info.plist" \
            "LiveActivity/LiveActivity.entitlements"; do
            git diff --quiet HEAD -- "$protected" || {
              echo "::error::Protected customization was modified: $protected"
              exit 1
            }
          done
          printf '%s\n' "$NEW_SOURCE" > .github/u200-last-synced.txt
          git add .github/u200-last-synced.txt
          git rm .github/workflows/trio_u200_donni_sync_once.yml
          if grep -qE '^(<<<<<<< |=======|>>>>>>> )' Trio.xcodeproj/project.pbxproj; then
            echo "::error::Xcode project contains merge markers"
            exit 1
          fi
          git diff --cached --check
          test "$(git status --porcelain | wc -l | tr -d ' ')" -gt 0
          git commit -m "Update Trio U200 from Donni2020, preserve checker and build settings"
          git push origin HEAD:refs/heads/update/trio-u200-donni-20261120
          echo "Donni2020 integration pushed to isolated update branch."
