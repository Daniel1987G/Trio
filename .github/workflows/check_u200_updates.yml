name: 5. Check Trio U200 Updates

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check Donni2020
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for updates
        shell: bash
        run: |
          set -euo pipefail

          SOURCE=$(git ls-remote https://github.com/Donni2020/Trio-U200.git refs/heads/main | cut -f1)
          CURRENT=$(tr -d '[:space:]' < .github/u200-last-synced.txt)

          echo "## Trio U200 – Update-Status" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Donni2020 aktuell: \`$SOURCE\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Zuletzt übernommen: \`$CURRENT\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          if [ -z "$SOURCE" ] || [ -z "$CURRENT" ]; then
            echo "Versionsprüfung fehlgeschlagen." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          if [ "$SOURCE" = "$CURRENT" ]; then
            echo "### ✅ Kein Update verfügbar" >> "$GITHUB_STEP_SUMMARY"
            echo "Dein Trio U200 ist auf dem zuletzt übernommenen Stand." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### 📦 Update verfügbar" >> "$GITHUB_STEP_SUMMARY"
            echo "Donni2020 hat einen anderen Commit-Stand veröffentlicht." >> "$GITHUB_STEP_SUMMARY"
            echo "Bitte Änderungen manuell prüfen und übernehmen." >> "$GITHUB_STEP_SUMMARY"
          fi
