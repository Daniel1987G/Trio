name: 5. Check Trio U200 Updates

on:
  workflow_dispatch:

jobs:
  select-u200:
    name: Bitte trio-u200 auswählen
    runs-on: ubuntu-latest

    steps:
      - name: Branch-Auswahl erklären
        run: |
          echo '### Bitte Branch `trio-u200` auswählen' >> "$GITHUB_STEP_SUMMARY"
          echo 'Dieser Branch enthält die eigentliche Update-Prüfung.' >> "$GITHUB_STEP_SUMMARY"
          exit 1
